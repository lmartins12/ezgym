<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'SETTINGS.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="none" inset>
    <ion-item>
      <ion-icon name="settings-outline" slot="start"></ion-icon>
      <ion-select
        interface="popover"
        class="always-flip"
        toggleIcon="caret-down-sharp"
        label="{{ 'SETTINGS.LANGUAGE' | translate }}"
        [value]="currentLang()"
        (ionChange)="onLanguageChange($event)"
      >
        <ion-select-option value="pt">
          {{ 'SETTINGS.LANGUAGE_PT' | translate }}
        </ion-select-option>
        <ion-select-option value="en">
          {{ 'SETTINGS.LANGUAGE_EN' | translate }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>{{ 'SETTINGS.DARK_MODE' | translate }}</ion-label>
      <ion-toggle slot="end" [checked]="isDarkMode()" (ionChange)="toggleTheme()"></ion-toggle>
    </ion-item>
  </ion-list>

  @if (canInstall()) {
    <ion-list lines="none" inset>
      <ion-item button="true" (click)="installApp()" detail="true">
        <ion-icon name="download-outline" slot="start" color="primary"></ion-icon>
        <ion-label color="primary">{{ 'SETTINGS.INSTALL_APP' | translate }}</ion-label>
      </ion-item>
    </ion-list>
  }

  <ion-list lines="none" inset>
    <ion-item button="true" (click)="openImportExport()">
      <ion-icon name="settings-outline" slot="start"></ion-icon>
      <ion-label>{{ 'IMPORT_EXPORT.TITLE' | translate }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
