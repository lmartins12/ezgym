<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'PROGRESS.TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="progress-container">
    @if (loading()) {
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
    } @else if (snapshot(); as data) {
    <app-stats-cards [stats]="data.stats" [locale]="currentLocale()" />
    <app-frequent-workouts [workouts]="data.frequentWorkouts" />
    <app-exercise-prs [prs]="data.exercisePRs" />
    <app-muscle-distribution [distribution]="data.muscleDistribution" />
    } @else {
    <div class="empty-state">
      <ion-icon name="trending-up"></ion-icon>
      <p>{{ 'PROGRESS.NO_DATA' | translate }}</p>
    </div>
    }
  </div>
</ion-content>
