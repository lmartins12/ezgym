<ion-item-sliding>
  <ion-item>
    <ion-reorder slot="start"></ion-reorder>
    @if (exercise().muscle_group) {
      <app-muscle-icon
        [muscleGroup]="exercise().muscle_group!"
        size="lg"
        slot="start"
      />
    }
    <ion-label>
      <h2 class="ez-truncate">{{ exercise().exercise_name }}</h2>
      <p>
        {{ exercise().sets }} × {{ exercise().reps }}
        @if (exercise().target_weight) {
          <span> @ {{ exercise().target_weight }}kg</span>
        }
        • {{ exercise().rest_seconds }}s
      </p>
    </ion-label>
    <ion-button
      fill="clear"
      slot="end"
      (click)="editExercise.emit(exercise())"
      [attr.aria-label]="
        ('COMMON.EDIT' | translate) + ': ' + exercise().exercise_name
      "
    >
      <ion-icon
        slot="icon-only"
        name="create-outline"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>
    <ion-button
      fill="clear"
      color="danger"
      slot="end"
      (click)="deleteExercise.emit(exercise().id)"
      [attr.aria-label]="
        ('COMMON.DELETE' | translate) + ': ' + exercise().exercise_name
      "
    >
      <ion-icon
        slot="icon-only"
        name="trash-outline"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>
  </ion-item>
  <ion-item-options side="end">
    <ion-item-option
      (click)="editExercise.emit(exercise())"
      [attr.aria-label]="'COMMON.EDIT' | translate"
    >
      <ion-icon slot="icon-only" name="create-outline"></ion-icon>
    </ion-item-option>
    <ion-item-option
      (click)="deleteExercise.emit(exercise().id)"
      color="danger"
      [attr.aria-label]="'COMMON.DELETE' | translate"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
