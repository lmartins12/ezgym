<ion-item-sliding>
  <ion-item-options side="start">
    <ion-item-option
      (click)="startWorkout.emit(workout())"
      [color]="workout().exercise_count > 0 ? 'primary' : 'medium'"
      [disabled]="workout().exercise_count === 0"
      [attr.aria-label]="'SESSION.DASHBOARD.RESUME' | translate"
    >
      <ion-icon slot="icon-only" name="play-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>

  <ion-item lines="none">
    <app-muscle-icon
      [muscleGroup]="workout().muscle_group"
      size="lg"
      slot="start"
    />
    <button type="button" class="workout-card__open" (click)="navigate()">
      <span class="workout-card__name ez-truncate">{{ workout().name }}</span>
      <span class="workout-card__meta">
        {{ workout().exercise_count }}
        {{
          (workout().exercise_count === 1
            ? "WORKOUTS.EXERCISE_ONE"
            : "WORKOUTS.EXERCISES"
          ) | translate
        }}
      </span>
      @if (workout().last_trained) {
        <span class="workout-card__last-trained">
          {{ "WORKOUTS.LAST_TRAINED" | translate }}:
          {{ workout().last_trained | date: dateFormat() }}
        </span>
      }
    </button>
    <ion-button
      fill="clear"
      slot="end"
      [disabled]="workout().exercise_count === 0"
      [attr.aria-label]="
        ('WORKOUT_DETAIL.START_WORKOUT' | translate) + ': ' + workout().name
      "
      (click)="startWorkout.emit(workout())"
      ><ion-icon
        slot="icon-only"
        name="play-outline"
        aria-hidden="true"
      ></ion-icon
    ></ion-button>
    <ion-button
      fill="clear"
      color="danger"
      slot="end"
      [attr.aria-label]="('COMMON.DELETE' | translate) + ': ' + workout().name"
      (click)="deleteWorkout.emit(workout().id)"
      ><ion-icon
        slot="icon-only"
        name="trash-outline"
        aria-hidden="true"
      ></ion-icon
    ></ion-button>
    <ion-reorder slot="end"></ion-reorder>
  </ion-item>

  <ion-item-options side="end">
    <ion-item-option
      (click)="deleteWorkout.emit(workout().id)"
      color="danger"
      [attr.aria-label]="'COMMON.DELETE' | translate"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
