<ion-header>
  <ion-toolbar>
    <ion-title style="text-align: start">
      @if (exercise) {
        {{ "EXERCISE.EDIT_TITLE" | translate }}
      } @else {
        {{ "EXERCISE.CREATE_TITLE" | translate }}
      }
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()" fill="clear" shape="round" color="danger">{{
        "COMMON.CANCEL" | translate
      }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form (ngSubmit)="submit()">
    <!-- Exercise Name -->
    <ion-input
      required
      autofocus
      name="name"
      fill="solid"
      label="{{ 'EXERCISE.NAME_LABEL' | translate }}"
      labelPlacement="floating"
      [maxlength]="nameMaxLength"
      [(ngModel)]="name"
    />

    <!-- Muscle Group -->
    <div>
      <ion-label labelPlacement="stacked" class="ion-margin-bottom">
        {{ "EXERCISE.MUSCLE_GROUP_LABEL" | translate }}
      </ion-label>
      <app-muscle-group-selector [(muscleGroup)]="muscleGroup" />
    </div>

    <!-- Equipment (Optional) -->
    <ion-input
      name="equipment"
      fill="solid"
      label="{{ 'EXERCISE.EQUIPMENT_LABEL' | translate }}"
      labelPlacement="floating"
      [maxlength]="equipmentMaxLength"
      [(ngModel)]="equipment"
    />

    <!-- Notes (Optional) -->
    <ion-textarea
      name="notes"
      fill="solid"
      label="{{ 'EXERCISE.NOTES_LABEL' | translate }}"
      labelPlacement="floating"
      [(ngModel)]="notes"
      [maxlength]="notesMaxLength"
      [rows]="2"
    />

    <!-- Divider -->
    <ion-item-divider>
      <ion-label>{{ "EXERCISE.SETTINGS_LABEL" | translate }}</ion-label>
    </ion-item-divider>

    <!-- Sets -->
    <ion-input
      type="number"
      inputmode="numeric"
      name="sets"
      fill="solid"
      label="{{ 'EXERCISE.SETS_LABEL' | translate }}"
      labelPlacement="floating"
      [ngModel]="sets()"
      (ngModelChange)="onSetsChange($event)"
      min="1"
      [max]="setsMax"
    />

    <!-- Reps -->
    <ion-input
      name="reps"
      fill="solid"
      label="{{ 'EXERCISE.REPS_LABEL' | translate }}"
      labelPlacement="floating"
      [(ngModel)]="reps"
      [maxlength]="repsMaxLength"
      [errorText]="repsInvalid() ? ('EXERCISE.REPS_INVALID' | translate) : ''"
      (ionInput)="repsInvalid.set(false)"
    />

    <!-- Target Weight (Optional) -->
    <ion-input
      type="number"
      inputmode="decimal"
      name="target_weight"
      fill="solid"
      label="{{ 'EXERCISE.WEIGHT_LABEL' | translate }}"
      labelPlacement="floating"
      [ngModel]="targetWeight()"
      (ngModelChange)="onWeightChange($event)"
      min="0"
      [max]="weightMax"
    />

    <!-- Rest Seconds -->
    <ion-input
      type="number"
      inputmode="numeric"
      name="rest_seconds"
      fill="solid"
      label="{{ 'EXERCISE.REST_LABEL' | translate }}"
      labelPlacement="floating"
      [ngModel]="restSeconds()"
      (ngModelChange)="onRestChange($event)"
      min="0"
      [max]="restMax"
    />
  </form>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-button expand="block" color="primary" (click)="submit()">
      {{ "COMMON.SAVE" | translate }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
