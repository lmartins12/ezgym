<ion-header>
  <ion-toolbar>
    <ion-title>{{ 'TABS.DASHBOARD' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content #content (ionScroll)="onScroll($event)" scrollEvents="true">
  <!-- Calendar Section -->
  <div class="dashboard-section">
    <app-dashboard-calendar
      [currentMonth]="currentMonth()"
      [datesWithEvents]="datesWithEvents()"
      [selectedDate]="selectedDate()"
      [today]="today()"
      [locale]="currentLocale()"
      (dateSelected)="onDateSelected($event)"
      (monthChanged)="onMonthChanged($event)"
    />
  </div>

  <!-- Date Filter Section -->
  <div class="dashboard-section">
    <app-dashboard-date-filter
      [startDate]="filterStartDate()"
      [endDate]="filterEndDate()"
      [isActive]="isFilterActive()"
      [locale]="currentLocale()"
      (filterChanged)="onDateRangeChanged($event)"
      (clearFilter)="clearFilters()"
    />
  </div>

  <!-- History List Section -->
  <div class="dashboard-section">
    <app-dashboard-history-list
      [events]="events()"
      [loading]="loading()"
      [loadingMore]="loadingMore()"
      [hasMore]="pagination().hasMore"
      (loadMore)="loadMoreEvents()"
      (eventClick)="onEventClick($event)"
    />
  </div>
</ion-content>

<app-dashboard-back-to-top
  [visible]="showBackToTop()"
  (clickTop)="scrollToTop()"
/>
